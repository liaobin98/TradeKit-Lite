name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:check -- --if-present
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: dist/
          retention-days: 14
